name: "Phoenix RoboCopy Pro"
description: "A neon-themed automation action for running Robocopy presets, queues, and backup workflows."
author: "Skyler (PHX-IT)"
branding:
  icon: "zap"
  color: "pink"

inputs:
  preset:
    description: "Name of the Phoenix RoboCopy Pro preset to run"
    required: true
  source:
    description: "Override source directory (optional)"
    required: false
  destination:
    description: "Override destination directory (optional)"
    required: false
  flags:
    description: "Custom Robocopy flags (optional)"
    required: false
  queue:
    description: "Run a queue of presets (comma-separated)"
    required: false

outputs:
  status:
    description: "Status of the backup job"
  report_url:
    description: "URL of the generated backup report"

runs:
  using: "node20"
  main: "dist/index.js"
